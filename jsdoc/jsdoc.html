<!doctype html>
<html lang="en">
<head>
	<title>JSDoc</title>
	<meta charset="utf-8">
	<link rel="icon" href="../favicon.svg">
	<link rel="stylesheet" href="../[common]/style.css">
	<script type="module" src="../[common]/module.js"></script>
</head>
<body>
	<page-header>
		<span slot="page-title">JSDoc</span>
	</page-header>

	<script type="module" src="jsdoc.js"></script>

	<main>


		<script>
			// Plain scripts like this don't automatically get typechecked

			/**
			 * @returns {boolean}
			 * @param {number} a
			 */
			function foo1(a = "abcd") {
				return `foo: ${a}`;
			}

		</script>


		<script type="module">
			// Nor does this
			// Would quite like if there was a way to check inline scripts like these


			/**
			 * @returns {boolean}
			 * @param {number} a
			 */
			function foo2(a = "abcd") {
				return `foo: ${a}`;
			}

			foo2();

		</script>

	</main>

	<script type="disabled" src="type-compatibility-basic.js"></script>
	<script type="disabled" src="type-compatibility-class.js"></script>


	<script type="module" src="folder/import.js"></script>


</body>
</html>
