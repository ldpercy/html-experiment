<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -32 64 64" width="100%" height="100%">
	<style>
		polyline {
			fill-opacity: 0.6;
			stroke-width:4;
			stroke-opacity: 0.6;
			stroke-linecap: round;
			stroke-linejoin: round;
		}
		.css	{ stroke:#663399; fill:#663399; }
		.js		{ stroke:#f7df1e; fill:#f7df1e; }
		.svg	{ stroke:#ffb13b; fill:#ffb13b; }
		.html	{ stroke:#ee4422; fill:#ee4422; }
	</style>

	<polyline points="+30,-30 +30,+30 -30,+30" class="js" />
	<polyline points="-30,+30 -30,-30 +30,-30" class="css"/>
	<polyline points="+0,+30 -30,0 +0,-30" class="svg"/>
	<polyline points="-0,-30 +30,0 -0,+30" class="html"/>

</svg>