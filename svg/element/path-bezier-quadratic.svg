<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1200 -1200 2400 2400" preserveAspectRatio="xMidYMid meet">
	<title>path - bezier quadratic smooth</title>
	<use href="../[common]/grid.svg#grid" x="0" y="0"/>
	<use href="../[common]/nav.svg#nav" x="0" y="-48%"/>


	<style>
		/*
		line {
			stroke:teal;
			stroke-dasharray: 10px 10px;
		} */

		path {
			stroke: #f00e;
			stroke-width:10;
			fill: #f007;
		}

		.group0 {
			--fill-colour: orange;
			--stroke-colour: blue;

			fill-opacity:55%;

			path {
				--deg : calc(360 * sibling-index()  / sibling-count());
				fill:	lch(from var(--fill-colour)		l c calc(h + var(--deg)) );
				stroke:	lch(from var(--stroke-colour)	l c calc(h + var(--deg)) );
			}

		}
	</style>


	<g>
		<path  d="M 0,0  Q 0,-1000 1000,-1000 "/>
		<path  d="M 1000,0  Q 0,500 1000,1000 "/>
	</g>


	<g class="group0" transform="translate(-800,200)">
		<path d="M -990,-110  T 110,110 220,550 T -110,-550 220,110 "/>
		<path d="M -880,-220  T 220,220 220,550 T -220,-550 330,110 "/>
		<path d="M -770,-330  T 330,330 220,550 T -330,-550 440,110 "/>
	</g>

</svg>