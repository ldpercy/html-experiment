<!doctype html>
<html lang="en">
<head>
	<title>markdown</title>
	<meta charset="utf-8">
	<link rel="icon" href="../[common]/html-experiment.svg">
	<link rel="stylesheet" href="../[common]/style.css">

	<!-- <script type="module" src="./page-header.js"></script> -->

</head>
<body>
	<header>
		<h1><a href="">markdown</a></h1>
		<nav>
			<a class="colourScheme-selector" href="?colourScheme=light" title="Light colour scheme" data-colourscheme="light">🟓</a>
			<a class="colourScheme-selector" href="?colourScheme=dark" title="Dark colour scheme" data-colourscheme="dark">🟒</a>
			<a title="To folder" href="./">🖿</a>
			<a title="Parent folder" href="../">🡅</a>
		</nav>
	</header>

	<main>
	<style>

		/* template {
			display: block;
			border: 1px dashed red;
		}
		*/


		h3 { color:purple; }

		section {
			border: 1px dashed silver;
		}


	</style>

	<form>
		<h2>markdown input</h2>

		<textarea id="textarea-markdownInput">
			source markdown
		</textarea>

		<!-- <button type="button" id="button-updateOutput">update output</button> -->

	</form>


	<script type="module">
		import { markdownToHTML } from './markdownUtil.js';

		document.getElementById('textarea-markdownInput').addEventListener('change', updateOutput);
		//document.getElementById('textarea-markdownInput').addEventListener('click', updateOutput);

		function updateOutput() {
			let markdown = document.getElementById('textarea-markdownInput').value;
			let html = markdownToHTML(markdown);
			document.getElementById('output-htmlOutput').innerHTML = html;
		}

		updateOutput();

	</script>


	<output id="output-htmlOutput">

	</output>


	<pre>
		<div>
			<p>asdfdsf</p>
		</div>

	</pre>



	</main>
</body>
</html>
