<!doctype html>
<html lang="en">
<head>
	<title>form</title>
	<meta charset="utf-8">
	<link rel="icon" href="../favicon.svg">
	<link rel="stylesheet" href="../[common]/style.css">
	<!-- <link rel="stylesheet" href="form.css"> -->
	<script defer src="../[common]/colourScheme-selector.js"></script>
</head>
<body>
	<header>
		<h1><a href="">form</a></h1>
		<nav>
			<a class="colourScheme-selector" href="?colourScheme=light" title="Light colour scheme" data-colourscheme="light">🟓</a>
			<a class="colourScheme-selector" href="?colourScheme=dark" title="Dark colour scheme" data-colourscheme="dark">🟒</a>
			<a title="To folder" href="./">🖿</a>
			<a title="Parent folder" href="../">🡅</a>
		</nav>
	</header>


	<main>
		<form name="myform" method="get">
			<h2>
				myform
			</h2>
			<fieldset onchange="document.forms.myform.method=document.forms.myform.formMethod.value">
				method:
				<label>
					<input type="radio" name="formMethod" value="get" checked >
					get
				</label>
				<label>
					<input type="radio" name="formMethod" value="post">
					post
				</label>
			</fieldset>

			<label>min and max only:</label>
			<input type="number" name="number-minmax" id="input-minmax" min="1" max="9" value="5"/>
			<label>step only:</label>
			<input type="number" name="number-step" id="input-step" step="1" value="5"/>
			<label>required only:</label>
			<input type="number" name="number-required" id="input-required" required value="5"/>

			<textarea name="mytextarea" title="this is a title attribute">
				mytextarea
			</textarea>


			<select name="mySelect" size="3">
				<option>mySelect option 1</option>
				<option>mySelect option 2</option>
				<option>mySelect option 3</option>
			</select>

			<input type="range" name="myrange" min="0" max="10" list="datalist-foo"/>

			<datalist id="datalist-foo">
				<option value="0" label="0">0</option>
				<option value="1" label="+1">+1</option>
				<option value="2" label="+2">+2</option>
				<option></option>
				<option></option>
				<option></option>
				<option></option>
				<option value="7" title="7" ></option>
				<option>8</option>
				<option value="9">9</option>
				<option>10</option>
			</datalist>

			<input type="color" name="myColour">

			<label>
				<input type="checkbox" name="myCheckbox-1">
				myCheckbox-1
			</label>

			<label>
				<input type="checkbox" name="myCheckbox-2">
				myCheckbox-2
			</label>


			<fieldset>
				myRadio:

				<input type="hidden" name="myRadio" value="hidden value">

				<label>
					<input type="radio" name="myRadio" value="radio1">
					radio1
				</label>
				<label>
					<input type="radio" name="myRadio" value="radio2">
					radio2
				</label>
				<label>
					<input type="radio" name="myRadio" value="radio3">
					radio3
				</label>
			</fieldset>



			<h3>inputs with the same name </h3>
			<input type="text" name="samename" value="samename 1">
			<input type="text" name="samename" value="samename 2">

			<label>
				<input type="hidden" name="checkboxWithHidden" value="hidden value">
				<input type="checkbox" name="checkboxWithHidden" value="checkbox value">
				checkboxWithHidden
			</label>


			<h3>Buttons</h3>

			<button type="button" name="myButton" value="myButton-value">myButton</button>

			<button type="button" id="button-outputFormInfo">
				outputFormInfo(document.forms.myform);
			</button>

			<button type="submit">submit</button>
		</form><!-- myform -->


		<output id="myOutput">
			<div>
				<h3>formData</h3>
				<code class="block" id="code-formData">
				</code>
			</div>

			<div>
				<h3>formEntries</h3>
				<code class="block" id="code-formEntries">
				</code>
			</div>

			<div>
				<h3>controlsCollection</h3>
				<code class="block" id="code-controlsCollection">
				</code>
			</div>


		</output>



		<script type="module">
			import {HTMLFormHelper} from "./HTMLFormHelper.js";

			document.getElementById('button-outputFormInfo').addEventListener('click',()=>outputFormInfo(document.forms.myform));

			document.querySelectorAll('form').forEach(
				(element) => {
					element.addEventListener('change',formOnchange);
				}
			);


			function formOnchange(event) {
				const form = event.currentTarget;
				console.log(form.name, event);
				//console.log(form.checkValidity());
				//console.log(form.reportValidity());
			}

			function outputFormInfo(formElement) {
				document.getElementById('code-formData').innerHTML			= JSON.stringify(mfh.formData, null, '\t');		// raw formData has no toString method
				document.getElementById('code-formEntries').innerHTML		= JSON.stringify(mfh.formEntries, null, '\t');
				document.getElementById('code-controlsCollection').innerHTML	= JSON.stringify(mfh.controlsCollection, null, '\t');


				//console.log(mfh.formSettings);
			}




			let mfh = new HTMLFormHelper(document.forms.myform);
			console.log(mfh);



		</script>


		<style>
			form { border-width: 3px; }
			form:valid {
				border-color: #0f0;
				/* filter: drop-shadow(0 0 1ex lime); */
				box-shadow: 0 0 1ex lime;
			}
			form:invalid {
				border-color: #f00;
				/* filter: drop-shadow(0 0 1ex red); */
				box-shadow: 0 0 1ex red;
			}

			input:valid { background-color: #0f05; }
			input:invalid { background-color: #f005; }

			#myOutput {
				display:grid;
				grid-template-columns: 1fr 1fr;
			}

		</style>

	</main>
</body>
</html>
