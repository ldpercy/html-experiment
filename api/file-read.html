<!doctype html>
<html lang="en">
<head>
	<title>File read</title>
	<meta charset="utf-8">
	<link rel="icon" href="../favicon.svg">
	<script type="module" src="../[common]/module.js"></script>
	<link rel="stylesheet" href="../[common]/style.css">
	<script type="module" src="../[html-common]/script/colourScheme-selector.js"></script>
</head>
<body>
	<page-header>
		<span slot="page-title">File read</span>
	</page-header>



	<main>



		<form name="fileFetch">
			<h2>Fetch file </h2>

			<input type="text" name="filePath" value="./file.md" class="full-width">

			<textarea name="fileContent" class="full-width"></textarea>

			<button type="button" name="button-readFetch">Fetch file</button>
		</form>


		<form name="fileImport">
			<h2>Import file</h2>

			<input type="text" name="filePath" value="../readme.md" class="full-width">

			<textarea name="fileContent" class="full-width"></textarea>

			<button type="button" name="button-readImport">Import file</button>
		</form>


		<script type="module">
			import * as file from '../[common]/file.js';

			console.log(file);

			function documentDOMContentLoaded() {

				//document.forms['fileRead']['filePath'].addEventListener('change', filePathChange);
				document.forms['fileFetch']['button-readFetch'].addEventListener('click', ()=>doFileFetch());
				document.forms['fileImport']['button-readImport'].addEventListener('click', ()=>doFileImport());

			}/* documentDOMContentLoaded */

			document.addEventListener('DOMContentLoaded', documentDOMContentLoaded);


			async function doFileFetch() {
				const filePath = document.forms['fileFetch']['filePath'].value;
				console.log('doFileFetch:', filePath);

				let fileContent = await file.fetchFile(filePath);		// fetch version

				document.forms['fileFetch']['fileContent'].value = fileContent;
			}


			async function doFileImport() {

				const filePath = document.forms['fileImport']['filePath'].value;
				console.log('doFileImport:', filePath);

				let fileContent = await file.importFile(filePath);		// import version

				document.forms['fileImport']['fileContent'].value = fileContent;
			}

		</script>


	</main>


</body>
</html>
