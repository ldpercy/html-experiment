<!doctype html>
<html lang="en">
<head>
	<title>cryptography</title>
	<meta charset="utf-8">
	<link rel="icon" href="../favicon.svg">
	<link rel="stylesheet" href="../[common]/style.css">
	<script type="module" src="../[common]/module.js"></script>
</head>
<body>
	<page-header>
		<span slot="page-title">cryptography</span>
	</page-header>

	<main>
		<style contenteditable="plaintext-only">
			label { display:block; margin:1em; }
			select { margin:1em; }
		</style>

		<form name="main">
			<h2>Form</h2>

			<button type="button" onclick="console.log(self.crypto.randomUUID())">
				onclick self.crypto.randomUUID();
			</button>

			<button type="button" onclick="handler()">
				handler self.crypto.randomUUID();
			</button>


		</form>


		<script>

			function handler() {
				console.log(self);
				console.log(self.crypto.randomUUID());
			}




		</script>


		<script type="module">
			import { HTMLApp } from "../[html-common]/module/HTMLApp.js";

			class FileApp extends HTMLApp {
				appName = "ExampleApp";
				appInfo = [`%c
					Example App 0.0.1 by ldpercy
					`.replace(/\n\t\t/g,'\n'),
					'color:light-dark(darkblue, lightblue);'
				];

				eventListeners = [
					// {
					// 	query: '#myForm',
					// 	type: 'change',
					// 	listener: this.formChangeListener
					// },
					{
						query: '#myform-input-file',
						type: 'change',
						listener: this.fileChangeListener
					},
					{
						query: '.colourScheme-selector',
						type: 'click',
						listener: this.colourSchemeListener
					},
					{
						query: '.colourScheme-selector',
						type: 'dblclick',
						listener: this.colourSchemeSpecialListener
					},
				];


				fileChangeListener(event) {
					console.log('fileChangeListener event', event);
					//console.log('fileChangeListener event.target', event.target);
					console.log('fileChangeListener event.target.files', event.target.files);
				}


				formChangeListener(event) {
					console.log('formChangeListener event', event);
					console.log('formChangeListener event.target', event.target);
				}

				colourSchemeListener(event) {
					//console.log('colourSchemeListener', event.target.dataset);
					event.preventDefault();
					this.setColourScheme(event.target.dataset.colourscheme);
				}

				colourSchemeSpecialListener(event) {
					//console.log('colourSchemeListener', event.target.dataset);
					event.preventDefault();
					this.setColourScheme(event.target.dataset.colourschemespecial);

				}

			}/* ExampleApp */

			var fileApp = new FileApp();
		</script>



	</main>


</body>
</html>
