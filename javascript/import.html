	<style contenteditable="plaintext-only">
		#the-output {
			font-family:monospace;

	<script>

		// import { factorial } from './module.js';		// can't do this in a non-module

		//mod0 = await import("./module.js");
		//console.log(mod0);


		//import("./data.json", { with: { type: "json" } });


	</script>

	<script type="module">
		import * as mod from './module.js';

		//console.log(typeof mod);
		console.log(mod);


		import * as mod2 from './module.js';
		console.log(mod2);
		// it doesn't seem to mind doing this... probably just creates another binding/mapping object





		/*
		**	import with type
		*/
		import json from './import.json' with { type:'json' };
		console.log(json);

		import css from './import.css' with { type:'css' };
		console.log(css);

		// import text from './import.md' with { type:'text' };		// works in ff, not in chrome yet
		// console.log(text);


		/*
		**	dynamic import
		*/

		const dynMod = await import("./module.js");
		console.log(dynMod);

	</script>
