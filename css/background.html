<!doctype html>
<html lang="en" class="emgrid-lr">
<head>
	<title>background</title>
	<meta charset="utf-8">
	<link rel="icon" href="../favicon.svg">
	<link rel="stylesheet" href="../[common]/style.css">
	<script type="module" src="../[common]/module.js"></script>
</head>
<body>
	<page-header>
		<span slot="page-title">background</span>
	</page-header>

	<main>

	<style contenteditable="plaintext-only" spellcheck="false">

		html body {
			background-color: hsl(from var(--body-background) h s l / 0.8);
		}

		main>div {
			background-color: greenyellow;
			background-image: url(../[common]/graphics/favicon-bw.svg);
			background-size: 3em;
		}


		.grid-container {
			display: grid;
			border: 2px solid green;
			border-radius:1ex;

			margin: var(--base-length);
			border-radius: var(--base-length);
			padding:1ex;
			justify-content: space-between;
			gap: 1ex;


			&>* { margin:inherit; padding:inherit; border-radius:inherit;	}

			section {
				grid-column-start: 1;
				grid-column-end: 3;
			}
			aside { grid-column-start: 2; }

		}

		@media (orientation: landscape) {
			.grid-container { grid-template-columns: 1fr 1fr 1fr 1fr ; }
		}

		@media (orientation: portrait) {
			.grid-container { grid-template-columns: 1fr 1fr ; }
		}
	</style>



	<div class="grid-container pretty">
		<div>abcd</div>
		<div>efgh</div>
		<p>ijkl</p>

		<section>mnop</section>
		<aside>qrst</aside>
		<div>uvwx</div>
		<div>yz</div>
	</div>


	<form class="grid-container pretty">
		<label for="input-abcd">abcd</label>
		<input id="input-abcd" type="text" name="text"/>
		<label for="input-efgh">efgh</label>
		<input id="input-efgh" type="date" name="date"/>
		<label for="input-ijkl">ijkl</label>
		<select id="input-ijkl" name="date">
			<option>123</option>
			<option>456</option>
			<option>789</option>
		</select>
		<label for="input-tyui">abcd</label>
		<input id="input-tyui" type="text" name="text"/>
	</form>


	<style>
		.emgrid-left {
			--line-colour: blue;
			background-image:
				repeating-linear-gradient(
					to bottom,
					var(--line-colour) 0px,
					var(--line-colour) 1px,
					transparent 1px,
					transparent 1em
				),
				repeating-linear-gradient(
					to right,
					var(--line-colour) 0px,
					var(--line-colour) 1px,
					transparent 1px,
					transparent 1em
				);
			background-position: left;
		}

		.emgrid-right {
			--line-colour: red;
			background-image:
				repeating-linear-gradient(
					to bottom,
					var(--line-colour) 0px,
					var(--line-colour) 1px,
					transparent 1px,
					transparent 1em
				),
				repeating-linear-gradient(
					to right,
					var(--line-colour) 0px,
					var(--line-colour) 1px,
					transparent 1px,
					transparent 1em
				);
			background-position: right;
		}

		.emgrid-lr {
			--line-colour: red;
			background:
				repeating-linear-gradient(
					to bottom,
					#ff00ff44 0px,
					#ff00ff44 1px,
					transparent 1px,
					transparent 1em
				),
				repeating-linear-gradient(
					to right,
					#0000ff44 0px,
					#0000ff44 1px,
					transparent 1px,
					transparent 1em
				),
				repeating-linear-gradient(
					to left,
					#ff000044 0px,
					#ff000044 1px,
					transparent 1px,
					transparent 1em
				)
			;
		}



	</style>


	</main>

</body>
</html>
