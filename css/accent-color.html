<!doctype html>
<html lang="en">
<head>
	<title>accent-color</title>
	<meta charset="utf-8">
	<link rel="icon" href="../favicon.svg">
	<link rel="stylesheet" href="../[common]/style.css">
	<script type="module" src="../[html-common]/script/colourScheme-selector.js"></script>
</head>
<body>
	<header>
		<h1><a href="">accent-color</a></h1>
		<nav>
			<a class="colourScheme-selector" href="?colourScheme=light" title="Light colour scheme" data-colourscheme="light">🟓</a>
			<a class="colourScheme-selector" href="?colourScheme=dark" title="Dark colour scheme" data-colourscheme="dark">🟒</a>
			<a title="To folder" href="./">🖿</a>
			<a title="Parent folder" href="../">🡅</a>
		</nav>
	</header>


	<main>


	<style contenteditable="plaintext-only">

		body {
			color-scheme: var(--colourScheme);
			/* --accent-color: #3daee9; */ /* firefox's accent colour */

			--accent-light: hsl(from var(--accent-colour) h s 70% );
			--accent-dark: hsl(from var(--accent-colour) h s 40% );

			accent-color: var(--accent-colour);

		}

		span {display:inline-block; padding:1em; }

		.colourscheme-light {
			color-scheme: light;
			accent-color: var(--accent-dark);
		}

		.colourscheme-dark {
			color-scheme: dark;
			accent-color: var(--accent-light);
		}

	</style>

	<form>

		<h2>Accent-color</h2>

		<fieldset class="colourInput">
			<input type="color" onchange="updateColourInput(this.value)">
			<input type="text" onchange="updateColourInput(this.value);" placeholder="colour string">
		</fieldset>


		<span style="background-color: var(--accent-colour);">accent colour</span>
		<span style="background-color: var(--accent-light);">accent colour - light</span>
		<span style="background-color: var(--accent-colour);">accent colour</span>
		<span style="background-color: var(--accent-dark);">accent colour - dark</span>


	</form>




	<form class="colourscheme-light">
		<h2>color-scheme: light</h2>

		<label>
			<input type="radio" name="radio" value="radio1">
			radio1
		</label>
		<label>
			<input type="radio" name="radio" value="radio2" checked>
			radio2
		</label>

		<label>
			<input type="checkbox" name="checkbox1" checked>
			checkbox1
		</label>
		<label>
			<input type="checkbox" name="checkbox2" checked>
			checkbox2
		</label>
		<input type="range">
		<progress max="100" value="70">70%</progress>
	</form>


	<form class="colourscheme-dark">
		<h2>color-scheme: dark</h2>
		<label>
			<input type="radio" name="radio" value="radio1">
			radio1
		</label>
		<label>
			<input type="radio" name="radio" value="radio2" checked>
			radio2
		</label>

		<label>
			<input type="checkbox" name="checkbox1" checked>
			checkbox1
		</label>
		<label>
			<input type="checkbox" name="checkbox2" checked>
			checkbox2
		</label>
		<input type="range">
		<progress max="100" value="70">70%</progress>
	</form>






	<style contenteditable="plaintext-only">
		.user-agent-crossover {
			fieldset {
				margin:0em;
				border:1px dotted grey;
				b {
					display:inline-block;
					width:3em;
				}
				/* --percent: attr(data-number); */
				/* --percent: attr(data-number <number>); */
				/* --percent: attr(data-number type(<number>)); */

				accent-color: hsl(from var(--accent-colour) h s var(--percent) );

			}

		}
	</style>

	<output class="user-agent-crossover">
		<h2>user agent crossover</h2>
		<fieldset style="--percent:0;">		<b>0</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:10;">	<b>10</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:20;">	<b>20</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:30;">	<b>30</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:40;">	<b>40</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:50;">	<b>50</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:60;">	<b>60</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:70;">	<b>70</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:80;">	<b>80</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:90;">	<b>90</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
		<fieldset style="--percent:100;">	<b>100</b>	<input type="checkbox" checked>	<input type="radio" checked>	<input type="range">	</fieldset>
	</output>


	<script>

		function setAccentColour(accentColour) {
			document.body.style.setProperty('--accent-colour', accentColour);
		}


		function updateColourInput(colourString) {
			setAccentColour(colourString);

		}

	</script>


	</main>

</body>
</html>
