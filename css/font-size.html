<!doctype html>
<html lang="en">
<head>
	<title>font-size</title>
	<meta charset="utf-8">
	<link rel="icon" href="../favicon.svg">
	<script type="module" src="../[common]/module.js"></script>
</head>
<body>
	<page-header>
		<span slot="page-title">font-size</span>
	</page-header>

	<link rel="stylesheet" href="../[common]/style-minus-typography.css">

	<main>

		<form>
			<label>--font-size</label>
			<input type="text" value="16px" onchange="document.documentElement.style.setProperty('--font-size',`${this.value}`)">

			<label>--multiplier</label>
			<input type="number" min="0.5" max="9" value="1.0" step="0.5" onchange="document.documentElement.style.setProperty('--multiplier',`${this.value}`)">


		</form>


		<section class="examples">
			<div style="width:10em; height:10em">
				style="width:10em; height:10em"
			</div>
			<div style="width:20em; height:20em">
				style="width:20em; height:20em"
			</div>
		</section>



		<section class="full-width">
			<div class="wrapper">
				<output class="emgrid">
					<!-- chrome overrides white-space-collapse when contenteditable is on -->
					<p contenteditable="plaintext-only" spellcheck="false" class="serif">ABCDEFGHIJKLM NOPQRSTUVWXYZ abcdefghijklm nopqrstuvwxyz</p>
					<p contenteditable="plaintext-only" spellcheck="false" class="sans-serif">ABCDEFGHIJKLM NOPQRSTUVWXYZ abcdefghijklm nopqrstuvwxyz</p>
					<p contenteditable="plaintext-only" spellcheck="false" class="monospace">ABCDEFGHIJKLM NOPQRSTUVWXYZ abcdefghijklm nopqrstuvwxyz</p>
				</output>
			</div>
		</section>


		<style contenteditable="plaintext-only" spellcheck="false">
			:root	{
				--font-size:	16px;
				--multiplier:	1;
				--base-unit:	var(--font-size);
			}

			/* html {
				font-size:		calc(var(--font-size) * var(--multiplier));
			} */

			/* link { font-size:16px; } */

			.examples {
				div {
					display: inline-block;
					background-color: lightpink;
					border:1px dashed deeppink;
				}
			}



			output p {
				display: block;

				outline: 1px dashed hotpink;

				margin-block:  calc(2 * var(--base-unit));
				margin-inline: calc(1 * var(--base-unit));

				/* font-size-adjust:  ex-height 0.5; */
				vertical-align: baseline;
				alignment-baseline: baseline;			/* not working for me */
				/* baseline | alphabetic | ideographic | middle | central | mathematical | text-before-edge | text-after-edge */

				white-space-collapse: collapse;			/* chrome overrides this */
			}
		</style>


		<style contenteditable="plaintext-only" spellcheck="false" class="maxHeight-small">

			output {

				display:block;

				transition: font-size 0.5s linear;

				min-height:5em;

				h1, h2, h3, h4, h5, h6, p {
					background-color:hsl(from lemonchiffon h s l / 0.5);
				}
			}

			.emgrid {

				background-position-x: left;
				background-position-y: 0px;
				--line-colour: hsl(from var(--text-colour) h s l / 0.2);
				--back-colour: #f000;

				background-image:
					repeating-linear-gradient(
						to bottom,
						var(--line-colour) calc(0.0 * var(--base-unit)),
						var(--line-colour) calc(0.1 * var(--base-unit)),
						var(--back-colour) calc(0.1 * var(--base-unit)),
						var(--back-colour) calc(1.0 * var(--base-unit))
					),
					repeating-linear-gradient(
						to right,
						var(--line-colour) calc(0.0 * var(--base-unit)),
						var(--line-colour) calc(0.1 * var(--base-unit)),
						var(--back-colour) calc(0.1 * var(--base-unit)),
						var(--back-colour) calc(1.0 * var(--base-unit))
					);
			}

			section {
				--element-colour: steelblue;
				/* grid-column-start: span 4; */
				div.wrapper {
					background-color: var(--scheme-colour);
					resize: both;
					overflow: auto;
				}
			}

		</style>



	</main>

</body>
</html>
