<!doctype html>
<html lang="en">
<head>
	<title>Colour input</title>
	<meta charset="utf-8">
	<link rel="icon" href="../[common]/html-experiment.svg">
	<link rel="stylesheet" href="../[common]/style.css">

</head>
<body>
	<header>
		<h1><a href="">Colour input</a></h1>
		<nav>
			<a class="colourScheme-selector" href="?colourScheme=light" title="Light colour scheme" data-colourscheme="light">🟓</a>
			<a class="colourScheme-selector" href="?colourScheme=dark" title="Dark colour scheme" data-colourscheme="dark">🟒</a>
			<a title="To folder" href="./">🖿</a>
			<a title="Parent folder" href="../">🡅</a>
		</nav>
	</header>

	<script type="module" src="index.js"></script>

	<main>


	<style>


	</style>

	<h3>This is an h3</h3>


	<template id="template-colourWidget"><!-- shadowrootmode="open" open closed -->
		<style>
			fieldset {
				border: 1px dotted silver;
				border-radius: var(--gap);
				padding: var(--gap);
				display: grid;
				gap: var(--gap);
				grid-template-columns: 1fr 1fr ;
				text-align: center;

				input[type=color] {
					height:100%;
					width:100%;
				}
			}
		</style>

		<fieldset>
			<slot name="title">Colour input</slot>
			<slot name="description">default description text</slot>

			<input type="color" id="input-color" onchange="console.log(this);">
			<input type="text" id="input-text" placeholder="colour string">
		</fieldset>
	</template>

	<colour-widget id="colour-widget-1" colour="red">
		<h3 slot="title"> Title 1</h3>
		<strong slot="description">colour input 1</strong>
	</colour-widget>

	<colour-widget id="colour-widget-2" colour="blue">
		<h3 slot="title"> Title 2</h3>
		<em slot="description">colour input 2</em>
	</colour-widget>



	<script>


		class ColourWidget extends HTMLElement {
			static observedAttributes = ["colour"];


			/** @type {HTMLInputElement} */ colorInput;
			/** @type {HTMLInputElement} */ textInput;


			constructor() {
				super();				// Always call super first in constructor

				/** @type { HTMLTemplateElement } */
				let template = document.querySelector("#template-colourWidget");
				//console.log(template);
				let templateContent = template.content;

				// this.shadowRoot =
				this.attachShadow({ mode: "open" });
				this.shadowRoot.appendChild(templateContent.cloneNode(true));

				console.log('this', this);
				//console.log('document', document);
				console.log('shadowRoot', this.shadowRoot);

				this.colorInput = this.shadowRoot.getElementById('input-color');
				this.textInput = this.shadowRoot.getElementById('input-text');


				this.shadowRoot.querySelectorAll('input').forEach(
					(element) => {
						element.addEventListener('change', (event) => this.updateColour(event.target.value));
					}
				);

			}/* constructor */


			connectedCallback() {
				//console.log("Custom element added to page.");
			}

			disconnectedCallback() {
				//console.log("Custom element removed from page.");
			}

			connectedMoveCallback() {
				//console.log("Custom element moved with moveBefore()");
			}

			adoptedCallback() {
				//console.log("Custom element moved to new page.");
			}


			attributeChangedCallback(name, oldValue, newValue) {
				console.log(
					`Attribute ${name} has changed from ${oldValue} to ${newValue}.`,
				);
				if (name === 'colour') { this.updateColour(newValue); }
			}


			updateColour(colourString) {
				this.shadowRoot.getElementById('input-color').value = colourString;
				this.shadowRoot.getElementById('input-text').value = colourString;
			}


		}/* class ColourWidget */


		customElements.define("colour-widget", ColourWidget);


	</script>



	</main>
</body>
</html>
