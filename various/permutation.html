	<script>

		function updateOutput() {

			const alphabet = document.getElementById('input-alphabet').value.split('');
			const width = parseInt(document.getElementById('input-width').value);

			let result = '';
			let index = 0;

			for (let r = 0; r < Math.ceil(alphabet.length / width); r++)
			{
				result += '<div>';
				for (let c = 0; c < width; c++)
				{
					index = c + r*width ;
					result += `<span title="alphabet:${index+1} [${index}] (${r},${c})">${alphabet[index]||''}</span>`;
				}
				result += '</div>';
			}

			document.getElementById('the-output').innerHTML = result;
		}


	</script>
	<style contenteditable="plaintext-only">
		#the-output {
			font-family:monospace;
			font-size:2em;
			line-height: 3ex;
			span {
				display:inline-block;
				width:2em;
				height:2em;
				outline: 1px dotted silver;
				text-align: center;
				vertical-align: middle;
			}

		}
		label {display:block;}
	</style>
