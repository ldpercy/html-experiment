	<page-header>
		<span slot="h1">permutation</span>
	</page-header>


	<script src="./permutations.js"></script>

	<main>

	<form id="output" onchange="updateOutput()">

		<label>String:</label>
		<input type="text" id="input-string" value="ab">

		<!-- <label>Width:</label>
		<input type="number" id="input-width" value="5" min="1" required> -->
		<button type="button" onclick="updateOutput()">update</button>
	</form>

	<style contenteditable="plaintext-only">
		#the-output {
			font-family:monospace;
			font-size:1.5em;
			line-height: 3ex;
			span {
				display:inline-block;
				padding:1ex;
				/* width:2em;
				height:2em; */
				outline: 1px dotted silver;
				text-align: center;
				vertical-align: middle;
			}

		}
		label {display:block;}
	</style>


	<output class="full-width">
		<h2>Result:</h2>
		<div id="the-output"></div>

	</output>

	<script>

		function updateOutput() {

			const stringSet = new Set(document.getElementById('input-string').value.split(''));

			console.log('updateOutput stringSet:', stringSet);

			// I think technically sets are unordered, but in js they retain insertion order


			if (stringSet.size > 6)
			{
				alert(`you probably don't want to do this...`);
				return;
			}
			let result = permutations(stringSet);

			console.log('result', result);


			//const width = parseInt(document.getElementById('input-width').value);



			let resultContent = Array.from(result).map(
				(element) => { return `<span>${element.join('')}</span>`}
			).join(' ');


			document.getElementById('the-output').innerHTML = resultContent;

		}/* updateOutput */



	</script>

	</main>
