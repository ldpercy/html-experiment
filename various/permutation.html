<!doctype html>
<html lang="en">
<head>
	<title>permutation</title>
	<meta charset="utf-8">
	<link rel="icon" href="../favicon.svg">
	<link rel="stylesheet" href="../[common]/style.css">
	<script type="module" src="../[common]/module.js"></script>
	<script type="module" src="../[html-common]/script/colourScheme-selector.js"></script>

</head>
<body>


	<page-header>
		<span slot="page-title">permutation</span>
	</page-header>


	<script src="./permutations.js"></script>

	<main>

	<form name="main">

		<label>String:</label>
		<input type="text" id="input-string" value="abc">


		<label>info</label>
		<output id="output-info"></output>

		<!-- <label>Width:</label>
		<input type="number" id="input-width" value="5" min="1" required> -->
		<button type="button" name="button-setPermutations">generate set permutations</button>

		<button type="button" name="button-arrayPermutations">generate array permutations</button>

	</form>

	<style contenteditable="plaintext-only">
		#the-output {
			font-family:monospace;
			font-size:1.4em;
			line-height: 3ex;
			span {
				display:inline-block;
				padding-inline:0.4em;
				outline: 1px dotted grey;
				text-align: center;
				vertical-align: middle;
			}

		}
		label {display:block;}
	</style>


	<output class="full-width">
		<h2>Result:</h2>
		<div id="the-output"></div>

	</output>

	<script>

		function updateOutput() {

			const inputString = document.getElementById('input-string').value;

			console.log('updateOutput inputString:', inputString);

			document.getElementById('output-info').innerHTML = `length: ${inputString.length}; permutations: ${factorial(inputString.length)}`;

			// I think technically sets are unordered, but in js they retain insertion order

			if (inputString.length > 6)
			{
				alert(`⚠️ you probably don't want to do this...`);
				return;
			}

			let output = getOutput(inputString);
			document.getElementById('the-output').innerHTML = output;

		}/* updateOutput */


		function getOutput(string) {
			let result = '';
			const stringSet = new Set(string.split(''));
			const stringPermutations = permutationsOfSet(stringSet);

			console.log('stringPermutations', stringPermutations);

			//const width = parseInt(document.getElementById('input-width').value);

			result = Array.from(stringPermutations).map(
				(element) => { return `<span>${element.join('')}</span>`}
			).join('');

			return result;
		}


		function documentDOMContentLoaded() {

			document.forms['main']['button-setPermutations'].addEventListener('click', updateOutput);
			document.forms['main']['button-arrayPermutations'].addEventListener('click', updateOutput);

			 updateOutput();
		}/* documentDOMContentLoaded */

		document.addEventListener('DOMContentLoaded', documentDOMContentLoaded);

	</script>


	</main>

</body>
</html>
